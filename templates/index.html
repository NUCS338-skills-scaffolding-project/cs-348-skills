<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS 348 TA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #6b21a8;
      color: #fff;
      padding: 14px 24px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 780px;
      flex: 1;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 88%;
    }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #6b21a8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: #f0e6ff;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }

    .file-tag {
      font-size: 0.78rem;
      color: #888;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #input-area {
      border-top: 1px solid #e5e5e5;
      padding: 14px 16px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #fff;
    }

    #message-input {
      flex: 1;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      max-height: 140px;
      overflow-y: auto;
      line-height: 1.4;
    }

    #message-input:focus { border-color: #6b21a8; }

    .icon-btn {
      background: none;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }

    .icon-btn:hover { background: #f3e8ff; border-color: #a855f7; color: #6b21a8; }

    #send-btn {
      background: #6b21a8;
      border: none;
      border-radius: 10px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    #send-btn:hover:not(:disabled) { background: #7e22ce; }
    #send-btn:disabled { background: #c4b5fd; cursor: not-allowed; }

    #file-input { display: none; }

    #file-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: #f3e8ff;
      border: 1px solid #c4b5fd;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.82rem;
      color: #6b21a8;
    }

    #file-badge.visible { display: flex; }

    #file-badge button {
      background: none;
      border: none;
      cursor: pointer;
      color: #9333ea;
      font-size: 1rem;
      line-height: 1;
      padding: 0;
    }

    .typing-cursor::after {
      content: "▋";
      animation: blink 0.7s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <header>CS 348 — Intro to AI &nbsp;|&nbsp; TA Assistant</header>

  <div id="chat-container">
    <div id="messages">
      <div class="message assistant">
        <div class="bubble">Hi! I'm your CS 348 TA. I'm here to help you with any lab or assignment — feel free to share your code or describe where you're stuck, and we'll figure it out together.</div>
      </div>
    </div>

    <div id="input-area">
      <input type="file" id="file-input" accept=".py,.txt,.md,.pdf" />

      <button class="icon-btn" id="upload-btn" title="Attach file">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05L12.25 20.24a5.26 5.26 0 01-7.44-7.44l9.19-9.19a3.51 3.51 0 014.96 4.96L9.77 17.76a1.75 1.75 0 01-2.48-2.48l8.35-8.35"/>
        </svg>
      </button>

      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <div id="file-badge">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span id="file-name"></span>
          <button id="remove-file" title="Remove file">×</button>
        </div>
        <textarea id="message-input" rows="1" placeholder="Ask a question or describe where you're stuck…"></textarea>
      </div>

      <button id="send-btn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const uploadBtn = document.getElementById("upload-btn");
    const fileInput = document.getElementById("file-input");
    const fileBadge = document.getElementById("file-badge");
    const fileNameEl = document.getElementById("file-name");
    const removeFileBtn = document.getElementById("remove-file");

    let conversationHistory = [];
    let pendingFile = null; // { name, content }

    // Auto-resize textarea
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
    });

    // Send on Enter (Shift+Enter for newline)
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", sendMessage);

    uploadBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      fileInput.value = "";

      if (file.name.endsWith(".pdf")) {
        const form = new FormData();
        form.append("file", file);
        const resp = await fetch("/upload", { method: "POST", body: form });
        const { text, name } = await resp.json();
        pendingFile = { name, content: text };
      } else {
        const text = await file.text();
        pendingFile = { name: file.name, content: text };
      }

      fileNameEl.textContent = pendingFile.name;
      fileBadge.classList.add("visible");
    });

    removeFileBtn.addEventListener("click", () => {
      pendingFile = null;
      fileBadge.classList.remove("visible");
    });

    function appendMessage(role, text, fileName) {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrapper.appendChild(bubble);

      if (fileName) {
        const tag = document.createElement("div");
        tag.className = "file-tag";
        tag.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> ${fileName}`;
        wrapper.appendChild(tag);
      }

      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text && !pendingFile) return;
      if (sendBtn.disabled) return;

      // Build user message content
      let userText = text;
      let displayFileName = null;

      if (pendingFile) {
        displayFileName = pendingFile.name;
        const codeBlock = "```python\n" + pendingFile.content + "\n```";
        userText = userText
          ? `${userText}\n\nHere is my code (${pendingFile.name}):\n${codeBlock}`
          : `Here is my code (${pendingFile.name}):\n${codeBlock}`;
        pendingFile = null;
        fileBadge.classList.remove("visible");
      }

      inputEl.value = "";
      inputEl.style.height = "auto";

      // Display user bubble (show only the typed text, not the embedded code block)
      appendMessage("user", text || `[attached ${displayFileName}]`, displayFileName);

      // Add to history
      conversationHistory.push({ role: "user", content: userText });

      // Disable input while streaming
      sendBtn.disabled = true;
      inputEl.disabled = true;

      // Create assistant bubble
      const bubble = appendMessage("assistant", "");
      bubble.classList.add("typing-cursor");
      let assistantText = "";

      try {
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: conversationHistory }),
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split("\n");
          buffer = lines.pop(); // keep incomplete line

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const payload = line.slice(6).trim();
            if (payload === "[DONE]") break;
            try {
              const { text: chunk } = JSON.parse(payload);
              assistantText += chunk;
              bubble.textContent = assistantText;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            } catch {}
          }
        }
      } catch (err) {
        bubble.textContent = "Sorry, something went wrong. Please try again.";
        console.error(err);
      }

      bubble.classList.remove("typing-cursor");
      if (assistantText) {
        conversationHistory.push({ role: "assistant", content: assistantText });
      }

      sendBtn.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
    }
  </script>
</body>
</html>
